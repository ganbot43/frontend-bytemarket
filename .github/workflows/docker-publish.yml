name: CI/CD — bytemarket-frontend

# Este repositorio publica la imagen bytemarket-frontend y actualiza ÚNICAMENTE
# el servicio "frontend" del servidor. No toca los otros seis ni la base de datos.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── CI: construir y publicar en Docker Hub ──────────────────────
  build-and-push:
    name: Build y Push a Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔑 Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Necesario para construir una arquitectura distinta a la del runner.
      - name: 🧬 Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 para el servidor y arm64 para probar en Mac con Apple Silicon.
      # Aquí sí cuesta: a diferencia de los servicios Java, la etapa de build
      # NO se puede fijar al runner. Nitro empaqueta sharp dentro de .output
      # con su binario nativo (sharp-linuxmusl-<arch>.node), así que compilar
      # en amd64 y copiar el resultado a arm64 metería el binario equivocado.
      # La imagen arm64 se construye emulada y tarda bastante más.
      - name: 🔨 Build y Push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ganbito/bytemarket-frontend:latest

  # ── CD: actualizar el servidor ──────────────────────────────────
  deploy:
    name: Desplegar en el servidor
    needs: build-and-push          # solo si la imagen se publicó bien
    runs-on: ubuntu-latest
    # Interruptor explícito: mientras no exista un servidor, este job se
    # SALTA en vez de fallar. Se activa creando la variable de repositorio
    # DEPLOY_ENABLED con el valor "true".
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: 🚀 Actualizar solo frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.SERVER_PATH }}"

            # Si no está el compose, parar aquí: seguir podría crear
            # contenedores sueltos fuera del proyecto.
            test -f docker-compose.prod.yml || {
              echo "::error::No encuentro docker-compose.prod.yml en $(pwd)"
              exit 1
            }

            docker compose -f docker-compose.prod.yml pull frontend

            # --no-deps: recrea SOLO este contenedor. Sin esto, docker podría
            # tocar los servicios de los que depende. Y nunca se usa "down",
            # que apagaría todo, ni "-v", que borraría la base de datos.
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            docker compose -f docker-compose.prod.yml ps frontend
